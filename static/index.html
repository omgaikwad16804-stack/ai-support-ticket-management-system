<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Support Desk</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SUPPORT OPERATIONS</p>
      <h1>AI Support Desk</h1>
      <p class="subtitle">Manage tickets, identify priorities, and draft helpful responses.</p>
    </div>
    <span class="live"><span></span> API connected</span>
  </header>

  <main>
    <section class="stats">
      <article class="stat"><span>Total tickets</span><strong id="total">0</strong></article>
      <article class="stat"><span>Open</span><strong id="open">0</strong></article>
      <article class="stat"><span>In progress</span><strong id="in_progress">0</strong></article>
      <article class="stat"><span>Resolved</span><strong id="resolved">0</strong></article>
      <article class="stat"><span>Urgent</span><strong id="urgent">0</strong></article>
    </section>

    <div class="layout">
      <section class="panel form-panel">
        <div class="panel-heading">
          <div><p class="eyebrow">NEW REQUEST</p><h2>Create a ticket</h2></div>
        </div>
        <form id="ticketForm">
          <label>Customer name<input id="customer_name" required maxlength="100" placeholder="e.g. Priya Sharma"></label>
          <label>Email address<input id="email" type="email" required maxlength="200" placeholder="priya@example.com"></label>
          <label>Subject<input id="subject" required minlength="3" maxlength="200" placeholder="e.g. Unable to log in"></label>
          <label>Description<textarea id="description" required minlength="5" maxlength="5000" rows="5" placeholder="Describe the issue..."></textarea></label>
          <button type="submit" class="primary">Create ticket <span>→</span></button>
          <p id="formMessage" class="message"></p>
        </form>
      </section>

      <section class="panel tickets-panel">
        <div class="panel-heading">
          <div><p class="eyebrow">WORK QUEUE</p><h2>Support tickets</h2></div>
          <button id="refresh" class="secondary" type="button">Refresh</button>
        </div>
        <div class="filters">
          <input id="search" placeholder="Search tickets..." aria-label="Search tickets">
          <select id="statusFilter" aria-label="Filter by status">
            <option value="">All statuses</option><option>Open</option><option>In Progress</option><option>Resolved</option><option>Closed</option>
          </select>
          <select id="categoryFilter" aria-label="Filter by category">
            <option value="">All categories</option><option>Technical</option><option>Billing</option><option>Account</option><option>General</option>
          </select>
        </div>
        <div id="ticketList" class="ticket-list"><p class="empty">Loading tickets...</p></div>
      </section>
    </div>
  </main>

  <dialog id="detailDialog">
    <div class="dialog-header"><div><p class="eyebrow">TICKET DETAILS</p><h2 id="detailTitle">Ticket</h2></div><button id="closeDialog" class="icon-button" aria-label="Close">×</button></div>
    <div id="detailContent"></div>
  </dialog>
  <div id="toast" role="status" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
